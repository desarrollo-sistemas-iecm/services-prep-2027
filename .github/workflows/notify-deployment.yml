# Avisa a deployment-prep-2027 que hay código nuevo en main para que construya
# y despliegue la imagen de PREP 2027 (workflow "release" en ese repo).

name: notify-deployment

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Token de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: desarrollo-sistemas-iecm
          repositories: deployment-prep-2027

      - name: repository_dispatch a deployment-prep-2027
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/desarrollo-sistemas-iecm/deployment-prep-2027/dispatches \
            -f event_type=source-updated \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
